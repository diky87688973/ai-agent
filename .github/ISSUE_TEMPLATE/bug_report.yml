name: Bug 报告
description: 提交可复现的异常行为
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        安全漏洞通过仓库 Security 页面私下提交，不进入公开 Issue。
  - type: textarea
    id: summary
    attributes:
      label: 现象
      description: 实际行为与预期行为的差异
      placeholder: 简短描述问题
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 从启动到出现问题的完整步骤
      placeholder: |
        1. 启动服务
        2. 打开某个会话
        3. 执行某个操作
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 环境
      description: 操作系统、Python 版本、浏览器、模型 provider
      placeholder: |
        OS:
        Python:
        Browser:
        Provider:
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志与截图
      description: 粘贴相关日志、错误栈或截图
      render: shell
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: 提交确认
      options:
        - label: 已检查现有 Issue，未发现重复
          required: true
        - label: 日志中已移除密钥、会话数据和私人路径
          required: true
