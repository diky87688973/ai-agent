name: 功能建议
description: 提出可验证的功能或改进
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: 使用场景
      description: 当前流程遇到的限制与影响
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 期望的行为、接口或交互
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 可选方案
      description: 已考虑的替代实现及其取舍
    validations:
      required: false
  - type: textarea
    id: scope
    attributes:
      label: 影响范围
      description: 涉及的层、插件、工具或界面
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: 提交确认
      options:
        - label: 已检查现有 Issue 与文档，未发现重复
          required: true
