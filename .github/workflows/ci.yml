name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # 只装两个**运行时**依赖。可选依赖（playwright / pytesseract / easyocr /
      # rarfile / edge-tts）不装：不装时对应工具自行降级或明确报错；
      # 装了会让"缺依赖"那几个用例走 skip 分支、失去覆盖。
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install "ruff>=0.5"

      - name: 门禁 依赖方向
        timeout-minutes: 3
        run: python -u scripts/check_imports.py
      - name: 门禁 静态检查
        timeout-minutes: 5
        run: python -u -m ruff check agent tests scripts
      - name: 门禁 Python 下限
        timeout-minutes: 3
        run: python -u scripts/check_python_floor.py
      - name: 门禁 UI JS 自检
        timeout-minutes: 3
        run: python -u scripts/check_ui_js.py
      - name: 门禁 静默异常
        timeout-minutes: 5
        run: python -u scripts/check_silent_except.py --all-strict
      - name: 门禁 README 一致性
        timeout-minutes: 3
        run: python -u scripts/check_readme.py
      - name: 门禁 确认文案无歧义
        timeout-minutes: 3
        run: python -u scripts/check_confirm_wording.py
      - name: 门禁 注释文案
        timeout-minutes: 5
        run: python -u scripts/check_comment_style.py
      - name: 门禁 注册表一致性
        timeout-minutes: 3
        run: python -u scripts/check_catalog.py

      - name: 单测（按文件，各限时 150 秒）
        timeout-minutes: 15
        shell: bash
        run: |
          # `-e` 必须关掉：某个文件非零退出时，`-e` 会终止整个脚本，后面的文件再也
          # 跑不到，失败清单就只剩第一个。这里自己记状态、统一在末尾退出。
          set +e
          # 逐文件跑，输出先落盘再打印：超时被杀（137）时已产出的日志也不会丢。
          # 退出码 2 = 该文件在本平台按设计跳过，不算失败。
          fail=0; skip=0
          for f in tests/test_*.py; do
            mod=$(basename "$f" .py)
            echo "::group::$mod"
            timeout 150 python -u -m unittest "tests.$mod" > "/tmp/$mod.log" 2>&1
            code=$?
            cat "/tmp/$mod.log"
            echo "::endgroup::"
            if [ "$code" -eq 2 ]; then
              echo "   $mod 跳过"
              skip=$((skip+1))
            elif [ "$code" -ne 0 ]; then
              echo "::error::$mod 退出码 $code"
              fail=$((fail+1))
            fi
          done
          echo "失败 $fail 个文件，跳过 $skip 个"
          [ "$fail" -eq 0 ]

      # 验收脚本逐个一步：卡住时 GitHub 直接指出是哪一个。
      # 退出码 2 = 本机跑不了（如缺真模型凭据），按跳过处理，不算失败。
      - name: 验收 batch a
        timeout-minutes: 4
        shell: bash
        run: python -u scripts/acceptance_batch_a.py || [ $? -eq 2 ]
      - name: 验收 batch b
        timeout-minutes: 4
        shell: bash
        run: python -u scripts/acceptance_batch_b.py || [ $? -eq 2 ]
      - name: 验收 batch c
        timeout-minutes: 4
        shell: bash
        run: python -u scripts/acceptance_batch_c.py || [ $? -eq 2 ]
      - name: 验收 batch d
        timeout-minutes: 4
        shell: bash
        run: python -u scripts/acceptance_batch_d.py || [ $? -eq 2 ]
      - name: 验收 batch e
        timeout-minutes: 4
        shell: bash
        run: python -u scripts/acceptance_batch_e.py || [ $? -eq 2 ]
      - name: 验收 batch f
        timeout-minutes: 4
        shell: bash
        run: python -u scripts/acceptance_batch_f.py || [ $? -eq 2 ]
      - name: 验收 mvp2
        timeout-minutes: 4
        shell: bash
        run: python -u scripts/acceptance_mvp2.py || [ $? -eq 2 ]
      - name: 验收 mvp3
        timeout-minutes: 5
        shell: bash
        run: python -u scripts/acceptance_mvp3.py || [ $? -eq 2 ]
      - name: 验收 phase3
        timeout-minutes: 4
        shell: bash
        run: python -u scripts/acceptance_phase3.py || [ $? -eq 2 ]
      - name: 验收 web
        timeout-minutes: 6
        shell: bash
        run: python -u scripts/acceptance_web.py || [ $? -eq 2 ]

      - name: 工程 data/ 检查
        run: >
          python -c "import subprocess,sys;
          r=subprocess.run(['git','status','--porcelain','data'],capture_output=True,text=True);
          sys.exit('CI 往工程 data/ 写了文件:\n'+r.stdout) if r.stdout.strip() else print('data/ 干净')"
