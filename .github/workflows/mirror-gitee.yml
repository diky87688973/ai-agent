name: Mirror to Gitee

on:
  push:
    branches: [main]
    tags: ["*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push mirror
        run: |
          git remote add gitee https://diky87688973:${{ secrets.GITEE_TOKEN }}@gitee.com/diky87688973/ai-agent.git
          git push --force gitee HEAD:main
          git push --force gitee --tags
