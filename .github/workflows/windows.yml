name: Windows GUI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: windows-gui-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . -c constraints.txt

      - name: GUI 启动器测试
        run: python -m unittest tests.test_gui_launcher tests.test_frozen_data_root

      - name: 构建原生启动器
        shell: powershell
        run: .\launcher\build.ps1

      - name: 校验产物
        shell: pwsh
        run: |
          if (!(Test-Path .\agent-gui.exe)) { throw "agent-gui.exe was not generated" }
          Get-Item .\agent-gui.exe | Select-Object FullName, Length

      - uses: actions/upload-artifact@v4
        with:
          name: agent-gui-windows
          path: agent-gui.exe
