<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
<script>try{var _t=localStorage.getItem("aiAgent.uiTheme");document.documentElement.setAttribute("data-ui-theme",_t==="light"?"light":"dark");}catch(e){document.documentElement.setAttribute("data-ui-theme","dark");}</script>
<title>AI Agent {{APP_VERSION}}</title>
<style>
{{CSS}}
</style>
</head>
<body>
<!-- 顶栏不含 TTS 朗读与沉浸模式入口，这两项能力未实现。
     agent-ui.js 对 hdrTtsBtn / toggleAudio 无引用。 -->
<header><b>AI Agent {{APP_VERSION}}</b>·<span class="muted" id="hdrModel">模型加载中…</span><span class="muted" id="cid"></span><span class="hdr-actions"><button type="button" id="hdrThemeBtn" class="hdr-theme-btn" title="切换为白天界面">白天模式</button></span></header>
<main>
<section class="chat">
<div class="p-title chat-title-row"><button id="chatMoreBtn" class="chat-more-btn" title="会话列表">⋮</button><div id="chatSessionMenu" class="chat-session-menu hidden"></div><div id="chatTabs" class="chat-tabs" role="tablist"></div><button id="nwTop" class="mode-plus">新会话 +</button></div>
<div id="chatConversationMount" class="chat-conversation-mount"></div>
<div class="row">
<div class="composer">
<div id="attachStrip" class="attach-strip hidden"></div>
<textarea id="t" placeholder="请输入你的任务，&#10;/ 输入命令　·　@ 关联文件　·　Ctrl+V 贴图"></textarea>
<input type="file" id="attachFile" accept="image/*" multiple hidden/>
<div class="composer-foot">
<div class="left-tools">
<button type="button" id="attachBtn" class="mode-plus" title="添加截图">🖼</button>
<button id="modePlus" class="mode-plus" title="选择模式">Auto +</button>
<button id="reasoningBtn" class="mode-plus reasoning-btn" title="推理强度">思考 · <span id="reasoningLabel">Max</span></button>
<!-- 模型选择是 composer 里的独立下拉
     （#modelPicker / #modelPickerBtn / #modelPickerMenu），与模式菜单平级、没有二级菜单。 -->
<div class="model-picker" id="modelPicker">
<button type="button" id="modelPickerBtn" class="mode-plus model-picker-btn" title="选择模型" aria-haspopup="listbox" aria-expanded="false">🧠 <span id="modelPickerLabel">模型加载中…</span> ▾</button>
<div id="modelPickerMenu" class="mode-menu model-picker-menu hidden" role="listbox"></div>
</div>
<div id="pluginActions" class="plugin-actions"></div>
<div id="reasoningMenu" class="mode-menu reasoning-menu hidden">
<button type="button" class="mode-item reasoning-choice reasoning-current" data-effort="max">Max — 深度推理</button>
<button type="button" class="mode-item reasoning-choice" data-effort="high">High — 标准推理</button>
</div>
<div id="modeMenu" class="mode-menu hidden">
<button class="mode-item" data-mode="auto">⚡ 默认模式 - Auto</button>
<button class="mode-item" data-mode="plan">📋 方案设计 - Plan 模式</button>
<button class="mode-item" data-mode="execute">▶️ 执行计划 - Execute 模式</button>

</div>
<span id="modeChip" class="mode-chip hidden"><span id="modeChipText">Plan</span><button id="modeChipClear" class="x" title="恢复默认">×</button></span>
</div>
<div class="right-actions">
<span class="send-hint">Enter 发送 / Shift+Enter 换行</span>
<button id="autoToggle" class="mode-plus" title="目标：设定后每轮结束自动用该文案发起新一轮（点击设置/查看）">目标</button>
<button id="stopTask" class="mode-plus stop-task hidden" title="停止当前会话任务">停止</button>
<button id="go" class="mode-plus" title="发送消息">发送</button>
</div>
</div>
<div id="slashPop" class="slash-pop hidden" aria-hidden="true">
<button type="button" class="slash-item" data-slash="auto"><span class="sl">/Auto</span><span class="sh"></span></button>
<button type="button" class="slash-item" data-slash="plan"><span class="sl">/Plan</span><span class="sh"></span></button>
<button type="button" class="slash-item" data-slash="execute"><span class="sl">/Execute</span><span class="sh"></span></button>
</div>
<div id="atPop" class="at-pop" style="visibility:hidden;top:-99999px" aria-hidden="true">
<div class="at-pop-head">
<button type="button" id="atUpBtn" class="at-up-btn" title="上级目录">← 向上</button>
<span id="atCurPath" class="at-cur-path"></span>
</div>
<div id="atList" class="at-list"></div>
</div>

</div>
</div>
</section>
<div id="classicSplitResizer" class="classic-split-resizer" role="separator" aria-orientation="vertical" aria-label="调整对话区与步骤区宽度" tabindex="0"></div>
<aside class="side" id="classicSidePane">
<div class="side-tabbar" id="sideTabbar">
<button type="button" class="side-tab active pinned" data-pane="steps" id="tabSteps" title="不可关闭">步骤</button>
</div>
<div class="side-pane-wrap" id="sidePaneWrap">
<div id="paneSteps" class="side-pane active" data-pane="steps">
<div class="p-title">步骤 · 工具与执行明细（点击标题展开）</div>
<div class="steps" id="steps"></div>
</div>
</div>
<div id="usage-bottom" class="usage-bottom"></div>
</aside>
</main>
<script>
{{agent-ui.js}}
</script>
</body></html>
