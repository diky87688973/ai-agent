[agent]
; 推理档位
reasoning_effort = high
; 备份保留天数
backup_retention_days = 7
; 单回合模型往返上限
max_passes = 64
; 用户规则文件
user_rules_file =
[context]
; 压缩触发阈值，单位 token
summary_token_threshold = 700000
; 保留完整用户轮数
full_user_rounds = 1
; 摘要输出字数上限
summary_output_max_chars = 5000
; 思维链回传预算，单位 token
reasoning_replay_tokens = 8000
; 带图用户轮数
image_turns = 1
; 带图张数上限
image_max = 8
