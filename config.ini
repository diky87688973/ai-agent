[agent]
; 推理档位
reasoning_effort = high
; 备份保留天数
backup_retention_days = 7
; 每回合模型往返上限
max_passes = 512
[context]
; 模型窗口缺失时的回退压缩阈值，单位 token
summary_token_fallback = 64000
; 压缩时保留最近对话轮数
full_user_rounds = 5
; 摘要输出字数上限
summary_output_max_chars = 5000
; 思维链回传预算，单位 token
reasoning_replay_tokens = 8000
; 带图用户轮数
image_turns = 1
; 带图张数上限
image_max = 8

[update]
; 自动检查更新间隔，单位分钟
check_interval_minutes = 30


[auth]
; auto / required / local
mode = required
; 会话有效期（小时）
session_hours = 12
; 登录失败限流
max_failures = 5
lock_seconds = 300
; 反向代理信任列表，逗号分隔；默认不信任
trusted_proxies =
allowed_hosts = 127.0.0.1,localhost,::1
; auto / true / false
cookie_secure = auto
; 可选认证 provider 模块
provider_module =
; GUI 通过一次性 bootstrap token 自动登录；浏览器仍需登录
desktop_auto_login = 1
