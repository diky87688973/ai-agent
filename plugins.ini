; 插件清单：列在这里的插件会被装载，没列的不加载。
;
; 每个插件一个节，节名固定 `[plugin:<名字>]`。**列出来就是装载** ——
; `.ini` 无布尔类型，没有 `enabled` 开关项：本节出现即装载。
;
;   version  插件版本（可选）。插件自己也能在 plugin.py 里声明 PLUGIN_VERSION，
;            两边都写时会核对，不一致记一条加载报告（照常装载）。
;   path     插件目录（可选，相对路径按插件根解析）。省掉取 `plugins/<名字>`，
;            所以常规布局不必写它。
;
; 各插件自己的配置项在 config.ini 里，节名由插件定义。
; 可贡献的能力与开发方式见 docs/subsystems/plugins.md。

[plugin:knowledge]
version = 1.0

[plugin:tts]
version = 1.0
