; 插件清单。每个插件一个节 `[plugin:<名字>]`。节在就进入装载候选。
; 开关、名字、描述、图标、版本写在该插件 plugin-config.ini 的 [base]。
; version  与 [base] version 核对，不一致只记报告，照常装载。
; path     插件目录。省掉则用 plugins/<名字>。
;
; 各插件自己的配置写在插件目录的 plugin-config.ini。
; 可贡献的能力与开发方式见 docs/subsystems/plugins.md。

[plugin:skills]
version = 1.0

[plugin:knowledge]
version = 1.0

; multi_model：启用后，模型清单以插件目录的 plugin-config.ini 为权威；
; 没有有效 [model:*] 条目时回落到 config.ini 的 [model_reasoning]。
[plugin:multi_model]
version = 1.0

; desktop_io：看屏与鼠标 / 键盘。三个工具默认装载；
; 后端不可用的平台（非 Windows / macOS）工具仍在，执行时报明确原因。
[plugin:desktop_io]
version = 1.0

; tts：停用。它无条件订阅每段回答增量，缺 edge-tts 时每句都往 stderr 打一条告警。
; [plugin:tts]
; version = 1.0
