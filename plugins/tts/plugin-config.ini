; 语音合成插件配置。改动后需重载插件生效。
[config]
; breeze = 本地模型（需先装模型与推理程序）；edge = 网络合成
engine = breeze
; 模型与推理程序的安装根目录；目录内约定放 <模型>.gguf 与 breeze-tts-2-cpp/breeze-server.exe
; 安装步骤见插件 skills/tts-setup.md
model_dir = 
default_model = breeze-tts-2-q4k
; 本地服务监听端口，只绑 127.0.0.1
server_port = 8137
; 拉起服务的最长等待秒数
startup_timeout = 20
; 空闲多少秒后停服释放显存；0 表示不回收
idle_timeout = 600
; 指令引导强度：1 关闭、2 折中、3 更贴合指令。实测 3 比 2 音色更稳、语调起伏还略大
; 代价是首帧变慢
cfg_scale = 3
; 参考音色 id；填了就锁定同一个说话人。留空则每句按描述重新采样、音色会漂
voice_id = fanyin
; 情感档位：平静 / 开心 / 愤怒 / 悲伤 / 撒娇 / 害怕，也可自填
emotion = 平静
; 语速倍率 0.5–2.0，由播放侧按此倍率变速，不改音高
speed = 1.2
; 仅 edge 引擎使用；保持迁移前的默认音色
edge_voice = zh-CN-XiaoxiaoNeural
; 1 = 本地引擎不可用时用 edge 兜底；0 = 直接报错
fallback_to_edge = 0
