[config]
; 截屏能力开关
eye = 1
; 鼠标能力开关
mouse = 1
; 键盘能力开关
keyboard = 1
; 等待能力开关
wait = 1
; 截屏长边上限，单位像素
max_side = 1920
; 网格间距，单位像素
grid_step = 100
; 截图画光标
cursor_mark = 1
; 输入后等待时间，单位毫秒
settle_ms = 60
; 字符输入间隔，单位毫秒
type_interval_ms = 12
; 悬停等待时间，单位毫秒
hover_settle_ms = 250
; 悬停移动时间，单位毫秒
hover_approach_ms = 120
; 悬停微移动开关
hover_wiggle = 1
; 等待轮询间隔，单位毫秒
wait_interval_ms = 200
